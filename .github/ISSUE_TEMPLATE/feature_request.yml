name: "Feature Request"
description: "Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate your ideas! Please describe what you'd like to see.

  - type: dropdown
    id: component
    attributes:
      label: "Component"
      description: "Which part of Cairn does this relate to?"
      options:
        - "Server (API / Web UI)"
        - "Dispatcher (Scheduler / Tasks)"
        - "Worker (Claude Code / Codex / Pi)"
        - "Container / Docker"
        - "New Worker Backend"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "Motivation"
      description: "Why is this feature needed? What problem does it solve?"
      placeholder: |
        I'm trying to ... but currently ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed Solution"
      description: "Describe how you'd like it to work."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered (optional)"
      description: "Any alternatives you've thought about."

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context (optional)"
      description: "Mockups, references, or related issues."
